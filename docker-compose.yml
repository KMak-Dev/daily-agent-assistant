# MongoDB + Spring Boot app. From repo root: cp .env.example .env && docker compose up --build
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secret}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME:-root}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD:-secret}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand({ ping: 1 }).ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: "27017"
      SPRING_MONGODB_DATABASE: daily_agent
      SPRING_MONGODB_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      SPRING_MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secret}
      SPRING_MONGODB_AUTHENTICATION_DATABASE: admin
      WORLD_NEWS_API_KEY: ${WORLD_NEWS_API_KEY:-}
      WORLD_NEWS_INGEST_ENABLED: ${WORLD_NEWS_INGEST_ENABLED:-true}
      WORLD_NEWS_LANGUAGE: ${WORLD_NEWS_LANGUAGE:-en}
      WORLD_NEWS_TEXT: ${WORLD_NEWS_TEXT:-}
      WORLD_NEWS_SOURCE_COUNTRY: ${WORLD_NEWS_SOURCE_COUNTRY:-}
      WORLD_NEWS_CATEGORY: ${WORLD_NEWS_CATEGORY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      NEWS_DAILY_BRIEFING_ENABLED: ${NEWS_DAILY_BRIEFING_ENABLED:-false}
      NEWS_DAILY_BRIEFING_CRON: ${NEWS_DAILY_BRIEFING_CRON:-0 0 8 * * *}
      NEWS_DAILY_BRIEFING_ZONE_ID: ${NEWS_DAILY_BRIEFING_ZONE_ID:-Asia/Hong_Kong}
      NEWS_DAILY_BRIEFING_DAY_OFFSET: ${NEWS_DAILY_BRIEFING_DAY_OFFSET:-1}
      NEWS_DAILY_BRIEFING_WINDOW_DAYS: ${NEWS_DAILY_BRIEFING_WINDOW_DAYS:-1}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
