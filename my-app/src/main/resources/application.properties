spring.application.name=my-app

# JSON error responses: include "message" (e.g. xAI failure reason). Use always for local debug; never for production-facing APIs.
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}

# Mongo connection (Spring Boot 4: spring.mongodb.*). Passwords with special characters are handled safely (no URI encoding).
# Defaults suit local dev against docker compose (mongo on localhost:27017).
# Docker Compose sets SPRING_MONGODB_HOST=mongodb and maps username/password from MONGO_INITDB_*.
#
# If you set spring.mongodb.uri (env SPRING_MONGODB_URI), it overrides host/port/user/password — e.g. Atlas or extra driver params.
spring.mongodb.host=${SPRING_MONGODB_HOST:localhost}
spring.mongodb.port=${SPRING_MONGODB_PORT:27017}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:daily_agent}
spring.mongodb.username=${SPRING_MONGODB_USERNAME:${MONGO_INITDB_ROOT_USERNAME:root}}
spring.mongodb.password=${SPRING_MONGODB_PASSWORD:${MONGO_INITDB_ROOT_PASSWORD:secret}}
spring.mongodb.authentication-database=${SPRING_MONGODB_AUTHENTICATION_DATABASE:admin}

# World News API (https://worldnewsapi.com) — one GET /search-news per scheduled run
worldnews.api-key=${WORLD_NEWS_API_KEY:}
worldnews.language=${WORLD_NEWS_LANGUAGE:en}
# Optional search-news filters (omit param when blank). See https://worldnewsapi.com/docs/search-news/
# When world_news_keywords has at least one document, text is built from keyword + operator rows at startup instead.
worldnews.text=${WORLD_NEWS_TEXT:}
worldnews.source-country=${WORLD_NEWS_SOURCE_COUNTRY:}
worldnews.category=${WORLD_NEWS_CATEGORY:}
worldnews.page-size=${WORLD_NEWS_PAGE_SIZE:25}
worldnews.ingest-enabled=${WORLD_NEWS_INGEST_ENABLED:true}
# ~24 API calls/day: first run 1 min after startup, then every hour
worldnews.ingest-initial-delay-ms=${WORLD_NEWS_INGEST_INITIAL_DELAY_MS:60000}
worldnews.ingest-fixed-delay-ms=${WORLD_NEWS_INGEST_FIXED_DELAY_MS:3600000}

# xAI Grok (https://docs.x.ai). Empty until XAI_API_KEY is set in the environment or .env via Compose.
xai.api-key=${XAI_API_KEY:}
xai.model=${XAI_MODEL:grok-4.20-reasoning}
xai.base-url=${XAI_BASE_URL:https://api.x.ai}
xai.batch-size=${XAI_BATCH_SIZE:10}
xai.excerpt-max-chars=${XAI_EXCERPT_MAX_CHARS:2000}
# Optional: default synthesis task (per-request briefingPrompt overrides). Leave blank for built-in default.
xai.briefing-prompt=${XAI_BRIEFING_PROMPT:}

# Daily analyze + Mongo archive (collection news_daily_briefings). Disabled by default to avoid surprise xAI usage.
# Cron is six fields (second minute hour day month weekday), interpreted in news.daily-briefing.zone-id.
# day-offset: subtract this many calendar days from "today" in that zone when the job runs (1 = previous day at 08:00).
news.daily-briefing.enabled=${NEWS_DAILY_BRIEFING_ENABLED:false}
news.daily-briefing.cron=${NEWS_DAILY_BRIEFING_CRON:0 0 8 * * *}
news.daily-briefing.zone-id=${NEWS_DAILY_BRIEFING_ZONE_ID:Asia/Hong_Kong}
news.daily-briefing.day-offset=${NEWS_DAILY_BRIEFING_DAY_OFFSET:1}
