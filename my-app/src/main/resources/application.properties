spring.application.name=my-app

# Spring Boot 4 uses spring.mongodb.uri (spring.data.mongodb.uri is ignored).
# SPRING_DATA_MONGODB_URI still works as a fallback for older .env / compose files.
# Default: Mongo on host (docker compose up mongodb). Hostname "mongodb" only inside Docker.
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://root:secret@localhost:27017/daily_agent?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}}
