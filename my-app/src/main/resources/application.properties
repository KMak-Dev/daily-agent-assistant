spring.application.name=my-app

# Mongo connection (Spring Boot 4: spring.mongodb.*). Passwords with special characters are handled safely (no URI encoding).
# Defaults suit local dev against docker compose (mongo on localhost:27017).
# Docker Compose sets SPRING_MONGODB_HOST=mongodb and maps username/password from MONGO_INITDB_*.
#
# If you set spring.mongodb.uri (env SPRING_MONGODB_URI), it overrides host/port/user/password — e.g. Atlas or extra driver params.
spring.mongodb.host=${SPRING_MONGODB_HOST:localhost}
spring.mongodb.port=${SPRING_MONGODB_PORT:27017}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:daily_agent}
spring.mongodb.username=${SPRING_MONGODB_USERNAME:${MONGO_INITDB_ROOT_USERNAME:root}}
spring.mongodb.password=${SPRING_MONGODB_PASSWORD:${MONGO_INITDB_ROOT_PASSWORD:secret}}
spring.mongodb.authentication-database=${SPRING_MONGODB_AUTHENTICATION_DATABASE:admin}
